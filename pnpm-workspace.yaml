minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
shellEmulator: true
pmOnFail: download

packages:
  - apps/*
  - packages/*

overrides:
  axios@>=1.0.0 <1.20.0: ^1.21.1
  glob@>=9.0.0 <=14.0.1: ^14.0.6
  katex@>=0.11.0 <0.18.2: ^0.19.1
  minimatch@>=7.0.0 <11.0.1: ^11.0.8
  tinypool@<2.1.2: ^2.2.0
  ts-deepmerge@<8.0.0: ^8.0.0
  uuid@<11.1.1: ^11.1.1

patchedDependencies:
  '@ts-rest/core': patches/@ts-rest__core.patch

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: true
  json-editor-vue: false
  msgpackr-extract: false
  puppeteer: true
  sharp: true
  simple-git-hooks: true
  vue-demi: false
