minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
shellEmulator: true
pmOnFail: download

packages:
  - apps/*
  - packages/*

patchedDependencies:
  '@ts-rest/core': patches/@ts-rest__core.patch

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: true
  json-editor-vue: false
  msgpackr-extract: false
  puppeteer: true
  sharp: true
  simple-git-hooks: true
  vue-demi: false
